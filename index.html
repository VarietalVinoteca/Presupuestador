<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Varietal Vinoteca — Armá tu pedido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #E8E2CF;
    --paper-2: #DED5B9;
    --ink: #20241D;
    --pine: #2B2540;
    --pine-light: #2F4A38;
    --mustard: #D6A73B;
    --mustard-dark: #B8892A;
    --stamp-red: #A63D31;
    --line: #B9AD8B;
    --white: #FBF8F0;
    --radius: 4px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--pine);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.04), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,0.03), transparent 45%);
    font-family: 'Work Sans', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 28px 14px 60px;
  }

  .wrap{
    max-width: 460px;
    margin: 0 auto;
  }

  header.top{
    text-align:center;
    color: var(--paper);
    margin-bottom: 22px;
  }
  header.top .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--mustard);
    margin-bottom: 6px;
  }
  header.top h1{
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(28px, 7vw, 36px);
    margin: 0 0 6px;
    line-height: 1.05;
  }
  header.top p{
    margin:0;
    font-size: 13.5px;
    opacity: 0.78;
  }

  .card{
    background: var(--paper);
    border-radius: var(--radius);
    padding: 20px 18px;
    margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  }

  .card h2{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--pine);
    margin: 0 0 14px;
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .card h2::before{
    content:"";
    width: 16px; height: 2px;
    background: var(--mustard-dark);
    display:inline-block;
  }

  /* Product picker */
  .productos{
    display:flex;
    flex-direction:column;
    gap: 8px;
  }
  .producto-btn{
    text-align:left;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap: 10px;
    font-family:'Work Sans', sans-serif;
    transition: border-color .15s ease, background .15s ease;
  }
  .producto-btn:hover{ border-color: var(--pine-light); }
  .producto-btn.activo{
    background: var(--pine);
    border-color: var(--pine);
    color: var(--paper);
  }
  .producto-btn{ align-items: center; }
  .foto-producto{
  width: 40px;
  height: 40px;
  object-fit: cover;
  border-radius: 4px;
  flex-shrink: 0;
  }
  .producto-btn .nombre{ font-weight: 600; font-size: 14.5px; }
  .producto-btn .precio{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    opacity: 0.85;
  }

  .variantes{
    display:flex;
    flex-wrap:wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .chip{
    border: 1px solid var(--line);
    background: var(--white);
    padding: 7px 13px;
    border-radius: 999px;
    font-size: 13px;
    cursor:pointer;
  }
  .chip.activo{
    background: var(--mustard);
    border-color: var(--mustard-dark);
    color: var(--ink);
    font-weight: 600;
  }

  .cantidad-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-top: 16px;
    gap: 12px;
  }
  .cantidad-row .label{
    font-size: 13px;
    font-weight: 500;
    color: var(--pine);
  }
  .stepper{
    display:flex;
    align-items:center;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow:hidden;
    background: var(--white);
  }
  .stepper button{
    width: 36px; height: 36px;
    border:none;
    background: transparent;
    font-size: 18px;
    cursor:pointer;
    color: var(--pine);
  }
  .stepper button:hover{ background: var(--paper-2); }
  .stepper input{
    width: 44px;
    text-align:center;
    border: none;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    height: 36px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 14px;
    background: transparent;
  }
  .stepper input:focus{ outline: 2px solid var(--mustard-dark); outline-offset: -2px; }

  .desc-hint{
    margin-top: 10px;
    font-size: 12px;
    font-family:'IBM Plex Mono', monospace;
    color: var(--stamp-red);
    min-height: 14px;
  }

  .agregar-btn{
    margin-top: 16px;
    width: 100%;
    background: var(--pine);
    color: var(--paper);
    border: none;
    padding: 12px;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    font-family: 'Work Sans', sans-serif;
  }
  .agregar-btn:hover{ background: var(--pine-light); }
  .agregar-btn:focus-visible{ outline: 2px solid var(--mustard); outline-offset: 2px; }

  /* Ticket / receipt */
  .ticket{
    background: var(--white);
    border-radius: var(--radius);
    padding: 22px 20px 26px;
    position: relative;
    box-shadow: 0 10px 28px rgba(0,0,0,0.22);
  }
  .ticket-header{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    margin-bottom: 14px;
  }
  .ticket-header .neg{
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .ticket-header .sub{
    font-size: 11px;
    opacity: 0.6;
    margin-top: 2px;
  }
  .dashed{
    border: none;
    border-top: 1px dashed var(--line);
    margin: 12px 0;
  }

  .empty-msg{
    text-align:center;
    font-size: 13px;
    color: #7a7362;
    padding: 18px 0;
    font-family:'IBM Plex Mono', monospace;
  }

  .item-row{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 7px 0;
  }
  .item-row .desc{ flex: 1; line-height: 1.4; }
  .item-row .desc .var{ opacity: 0.65; }
  .item-row .desc .off{
    color: var(--stamp-red);
    font-weight: 600;
  }
  .item-row .monto{
    white-space: nowrap;
    font-weight: 600;
  }
  .item-row .quitar{
    background:none;
    border:none;
    color: #999;
    cursor:pointer;
    font-size: 15px;
    padding: 0 2px;
    line-height: 1;
  }
  .item-row .quitar:hover{ color: var(--stamp-red); }

  .total-row{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    font-family:'IBM Plex Mono', monospace;
    margin-top: 4px;
  }
  .total-row .lbl{
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .total-row .val{
    font-size: 22px;
    font-weight: 600;
    color: var(--pine);
  }

  .ahorro-nota{
    text-align: right;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--stamp-red);
    margin-top: 2px;
  }

  .stamp{
    position:absolute;
    top: 14px;
    right: 16px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 2px dashed var(--stamp-red);
    color: var(--stamp-red);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    transform: rotate(-12deg);
    font-family:'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 11px;
    line-height: 1.1;
    text-align:center;
    opacity: 0.85;
    mix-blend-mode: multiply;
    pointer-events:none;
  }

  .tear{
    height: 12px;
    margin: 0 -20px -26px;
    background:
      linear-gradient(135deg, var(--white) 50%, transparent 50%) 0 50% / 14px 14px repeat-x,
      linear-gradient(-135deg, var(--white) 50%, transparent 50%) 0 50% / 14px 14px repeat-x;
    background-color: transparent;
  }

  .enviar-btn{
    margin-top: 26px;
    width: 100%;
    background: #25D366;
    color: #08341c;
    border: none;
    padding: 15px;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 9px;
    font-family: 'Work Sans', sans-serif;
    transition: transform .1s ease, background .15s ease;
  }
  .enviar-btn:hover{ background: #21bd5c; }
  .enviar-btn:active{ transform: scale(0.98); }
  .enviar-btn:disabled{
    background: #cfcfc7;
    color: #8a8a80;
    cursor: not-allowed;
  }
  .enviar-btn svg{ width: 18px; height: 18px; flex-shrink:0; }

  .foot-note{
    text-align:center;
    color: var(--paper);
    opacity: 0.55;
    font-size: 11.5px;
    margin-top: 18px;
    font-family:'IBM Plex Mono', monospace;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">Presupuestador</div>
    <h1>Varietal Vinoteca</h1>
    <p>Elegí tus productos y mandanos el pedido armado</p>
  </header>

  <!-- Selección de producto -->
  <section class="card">
    <h2>1. Elegí el producto</h2>
    <div class="productos" id="productos"></div>

    <div class="variantes" id="variantes" style="display:none;"></div>

    <div class="cantidad-row">
      <span class="label">Cantidad</span>
      <div class="stepper">
        <button type="button" id="menos" aria-label="Restar">–</button>
        <input type="number" id="cantidad" value="1" min="1" inputmode="numeric">
        <button type="button" id="mas" aria-label="Sumar">+</button>
      </div>
    </div>
    <div class="desc-hint" id="descHint"></div>

    <button class="agregar-btn" id="agregarBtn">Agregar al pedido</button>
  </section>

  <!-- Ticket -->
  <section class="ticket" id="ticketCard">
    <div class="stamp" id="stamp" style="display:none;"></div>
    <div class="ticket-header">
      <div class="neg">Varietal Vinoteca</div>
      <div class="sub">Presupuesto — no es factura</div>
    </div>
    <hr class="dashed">
    <div id="listaItems">
      <div class="empty-msg">Todavía no agregaste productos</div>
    </div>
    <hr class="dashed">
    <div class="total-row">
      <span class="lbl">Total</span>
      <span class="val" id="totalVal">$0</span>
    </div>
    <div class="ahorro-nota" id="ahorroNota"></div>
    <div class="tear"></div>
  </section>

  <button class="enviar-btn" id="enviarBtn" disabled>
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2c-5.46 0-9.9 4.44-9.9 9.9 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.9-4.44 9.9-9.9 0-2.65-1.03-5.13-2.9-7C17.17 3.03 14.68 2 12.04 2zm5.8 14.1c-.24.68-1.4 1.3-1.93 1.37-.5.08-1.12.11-1.8-.11-.42-.13-.95-.31-1.64-.6-2.88-1.24-4.76-4.13-4.9-4.32-.14-.19-1.17-1.55-1.17-2.96 0-1.4.74-2.09 1-2.38.26-.28.57-.35.76-.35.19 0 .38 0 .55.01.18.01.42-.07.65.5.24.58.81 2 .88 2.14.07.14.12.31.02.5-.09.19-.14.31-.28.47-.14.17-.29.37-.42.5-.14.14-.28.29-.12.57.16.28.71 1.17 1.52 1.89 1.05.93 1.93 1.22 2.21 1.36.28.14.44.12.6-.07.17-.19.7-.81.89-1.09.19-.28.38-.23.63-.14.26.09 1.66.78 1.94.92.28.14.47.21.53.33.07.12.07.68-.17 1.36z"/></svg>
    Enviar pedido por WhatsApp
  </button>

  <p class="foot-note">Al enviar, confirmás el pedido según este presupuesto</p>
</div>

<script>
  /* ======================================================
     CONFIGURACIÓN — Editá esta sección con tus productos,
     precios, variantes, descuentos por cantidad y tu número
     de WhatsApp. El resto del código no hace falta tocarlo.
     ====================================================== */
  const CONFIG = {
    negocio: "Varietal vinoteca",
    // Número de WhatsApp con código de país y de área, SIN el "+" ni espacios
    // Ejemplo Córdoba, Argentina: 54 9 351 1234567 -> "5493511234567"
    telefono: "5493515089742",
    productos: [
      {
        id: "perdices",
        nombre: "By the Glass Las Perdices",
        imagen: "bib-perdices.png",
        variantes: ["Malbec 3 Litros"],
        precio: 28500,
        descuentos: [
          { desde: 1, hasta: 5, porcentaje: 20 },
          { desde: 6, hasta: 11, porcentaje: 20 },
          { desde: 12, hasta: 9999, porcentaje: 20 }
        ]
      },
{
        id: "obra",
        nombre: "Triple Obra Prima (3 Botellas)",
        imagen: "obraprima.png",
        variantes: ["Surtido"],
        precio: 46667,
        descuentos: [
          { desde: 1, hasta: 5, porcentaje: 25 },
          { desde: 6, hasta: 11, porcentaje: 25 },
          { desde: 12, hasta: 9999, porcentaje: 25 }
        ]
      },
{
        id: "exploracion",
        nombre: "Exploración Sur Caja (6 Botellas)",
        imagen: "exploracionsur.png",
        variantes: ["Malbec", "Cabernet Sauvignon"],
        precio: 83077,
        descuentos: [
          { desde: 1, hasta: 2, porcentaje: 35 },
          { desde: 3, hasta: 5, porcentaje: 35 },
          { desde: 6, hasta: 9999, porcentaje: 35 }
        ]
      },
      {
        id: "vinos",
        nombre: "Don Juan Blend (4 Botellas)",
        imagen: "donjuan.png",
        variantes: ["Blend"],
        precio: 116000,
        descuentos: [
          { desde: 1, hasta: 1, porcentaje: 25 },
          { desde: 2, hasta: 3, porcentaje: 25 },
          { desde: 4, hasta: 9999, porcentaje: 25 }
        ]
      }
    ]
  };
  /* ================== FIN CONFIGURACIÓN ================== */

  let productoActivo = CONFIG.productos[0];
  let varianteActiva = productoActivo.variantes[0] || null;
  let cart = [];

  const $productos = document.getElementById('productos');
  const $variantes = document.getElementById('variantes');
  const $cantidad = document.getElementById('cantidad');
  const $descHint = document.getElementById('descHint');
  const $listaItems = document.getElementById('listaItems');
  const $totalVal = document.getElementById('totalVal');
  const $ahorroNota = document.getElementById('ahorroNota');
  const $stamp = document.getElementById('stamp');
  const $enviarBtn = document.getElementById('enviarBtn');

  function formatoPesos(n){
    return '$' + Math.round(n).toLocaleString('es-AR');
  }

  function calcularDescuento(producto, cantidad){
    const tier = producto.descuentos.find(d => cantidad >= d.desde && cantidad <= d.hasta);
    return tier ? tier.porcentaje : 0;
  }

  function renderProductos(){
    $productos.innerHTML = '';
    CONFIG.productos.forEach(p => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'producto-btn' + (p.id === productoActivo.id ? ' activo' : '');
      const imgTag = p.imagen ? `<img src="${p.imagen}" alt="${p.nombre}" class="foto-producto">` : '';
      btn.innerHTML = `${imgTag}<span class="nombre">${p.nombre}</span><span class="precio">${formatoPesos(p.precio)}</span>`;
      btn.addEventListener('click', () => {
        productoActivo = p;
        varianteActiva = p.variantes[0] || null;
        $cantidad.value = 1;
        renderProductos();
        renderVariantes();
        renderDescHint();
      });
      $productos.appendChild(btn);
    });
  }

  function renderVariantes(){
    if (!productoActivo.variantes.length){
      $variantes.style.display = 'none';
      $variantes.innerHTML = '';
      return;
    }
    $variantes.style.display = 'flex';
    $variantes.innerHTML = '';
    productoActivo.variantes.forEach(v => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (v === varianteActiva ? ' activo' : '');
      chip.textContent = v;
      chip.addEventListener('click', () => {
        varianteActiva = v;
        renderVariantes();
      });
      $variantes.appendChild(chip);
    });
  }

  function renderDescHint(){
    const cantidad = parseInt($cantidad.value, 10) || 1;
    const pct = calcularDescuento(productoActivo, cantidad);
    if (pct > 0){
      $descHint.innerHTML = `<span class="oferta-activa">🏷️ ${pct}% OFF a aplicar</span>`;
    } else {
      const siguiente = productoActivo.descuentos.find(d => d.desde > cantidad && d.porcentaje > 0);
      $descHint.innerHTML = siguiente
        ? `<span class="oferta-siguiente">Llevando ${siguiente.desde} o más: ${siguiente.porcentaje}% off</span>`
        : '';
    }
  }

  function renderTicket(){
    if (cart.length === 0){
      $listaItems.innerHTML = '<div class="empty-msg">Todavía no agregaste productos</div>';
      $totalVal.textContent = formatoPesos(0);
      $ahorroNota.textContent = '';
      $stamp.style.display = 'none';
      $enviarBtn.disabled = true;
      return;
    }

    $listaItems.innerHTML = '';
    let total = 0;
    let ahorroTotal = 0;

    cart.forEach((item, idx) => {
      total += item.subtotal;
      ahorroTotal += item.ahorro;

      const row = document.createElement('div');
      row.className = 'item-row';
      const varTxt = item.variante ? ` <span class="var">(${item.variante})</span>` : '';
      const offTxt = item.descuentoPct > 0 ? ` <span class="off">−${item.descuentoPct}%</span>` : '';
      row.innerHTML = `
        <div class="desc">${item.nombre}${varTxt} × ${item.cantidad}${offTxt}</div>
        <div class="monto">${formatoPesos(item.subtotal)}</div>
        <button class="quitar" aria-label="Quitar" data-idx="${idx}">×</button>
      `;
      $listaItems.appendChild(row);
    });

    $listaItems.querySelectorAll('.quitar').forEach(btn => {
      btn.addEventListener('click', () => {
        cart.splice(parseInt(btn.dataset.idx, 10), 1);
        renderTicket();
      });
    });

    $totalVal.textContent = formatoPesos(total);

    if (ahorroTotal > 0){
      $ahorroNota.textContent = `Ahorrás ${formatoPesos(ahorroTotal)} `;
      $stamp.style.display = 'flex';
      const pctPromedio = Math.round((ahorroTotal / (total + ahorroTotal)) * 100);
      $stamp.innerHTML = `<span>${pctPromedio}%</span><span>OFF</span>`;
    } else {
      $ahorroNota.textContent = '';
      $stamp.style.display = 'none';
    }

    $enviarBtn.disabled = false;
  }

  document.getElementById('menos').addEventListener('click', () => {
    const v = Math.max(1, (parseInt($cantidad.value, 10) || 1) - 1);
    $cantidad.value = v;
    renderDescHint();
  });
  document.getElementById('mas').addEventListener('click', () => {
    const v = (parseInt($cantidad.value, 10) || 1) + 1;
    $cantidad.value = v;
    renderDescHint();
  });
  $cantidad.addEventListener('input', () => {
    if (parseInt($cantidad.value, 10) < 1 || !$cantidad.value) $cantidad.value = 1;
    renderDescHint();
  });

  document.getElementById('agregarBtn').addEventListener('click', () => {
    const cantidad = parseInt($cantidad.value, 10) || 1;
    const pct = calcularDescuento(productoActivo, cantidad);
    const bruto = productoActivo.precio * cantidad;
    const subtotal = bruto * (1 - pct / 100);
    const ahorro = bruto - subtotal;

    cart.push({
      nombre: productoActivo.nombre,
      variante: varianteActiva,
      cantidad,
      descuentoPct: pct,
      subtotal,
      ahorro
    });

    $cantidad.value = 1;
    renderDescHint();
    renderTicket();
  });

  $enviarBtn.addEventListener('click', () => {
    if (cart.length === 0) return;
    let total = cart.reduce((s, i) => s + i.subtotal, 0);

    let texto = `🧾 *Pedido — ${CONFIG.negocio}*\n\n`;
    cart.forEach((item, i) => {
      const varTxt = item.variante ? ` (${item.variante})` : '';
      const offTxt = item.descuentoPct > 0 ? ` — ${item.descuentoPct}% off` : '';
      texto += `${i + 1}) ${item.nombre}${varTxt} x${item.cantidad}${offTxt} — ${formatoPesos(item.subtotal)}\n`;
    });
    texto += `\n*Total: ${formatoPesos(total)}*\n\n`;
    texto += `Confirmo este pedido según el presupuesto calculado. 🙌`;

    const url = `https://wa.me/${CONFIG.telefono}?text=${encodeURIComponent(texto)}`;
    window.open(url, '_blank');
  });

  renderProductos();
  renderVariantes();
  renderDescHint();
  renderTicket();
</script>

</body>
</html>
